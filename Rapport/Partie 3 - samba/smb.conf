# ============================================================
# smb.conf - Configuration Samba pour la SAE2.04-3
# 6 repertoires de partage avec droits differencies par groupe
# ============================================================

[global]
   workgroup = WORKGROUP
   server string = Serveur Samba SAE2.04
   # Authentification obligatoire par compte utilisateur
   security = user
   # Rejeter les connexions avec identifiants inconnus
   map to guest = Bad User
   log file = /var/log/samba/%m.log
   max log size = 50

# ---- Repertoire public : R+W pour tous les groupes --------
[public]
   comment = Repertoire commun a tous
   path = /partage/public
   browsable = yes
   writable = yes
   # Les trois groupes ont acces
   valid users = @cmoi @ctoi @cnous
   create mode = 0664
   directory mode = 0775

# ---- amoi : R+W pour cmoi uniquement ----------------------
[amoi]
   comment = Repertoire prive du groupe cmoi
   path = /partage/amoi
   # Seul cmoi peut se connecter
   valid users = @cmoi
   write list = @cmoi
   read only = no
   create mode = 0660
   directory mode = 0770

# ---- atoi : R+W pour ctoi, R seul pour cmoi ---------------
[atoi]
   comment = Repertoire prive du groupe ctoi
   path = /partage/atoi
   # cmoi peut lire, ctoi peut ecrire
   valid users = @cmoi @ctoi
   write list = @ctoi
   read only = yes
   create mode = 0660
   directory mode = 0770

# ---- anous : R+W pour cnous, R seul pour cmoi et ctoi -----
[anous]
   comment = Repertoire prive du groupe cnous
   path = /partage/anous
   # cmoi et ctoi peuvent lire, cnous peut ecrire
   valid users = @cmoi @ctoi @cnous
   write list = @cnous
   read only = yes
   create mode = 0660
   directory mode = 0770

# ---- amoi-atoi : R+W pour cmoi, R pour ctoi ---------------
[amoi-atoi]
   comment = Repertoire partage entre cmoi et ctoi
   path = /partage/amoi-atoi
   valid users = @cmoi @ctoi
   write list = @cmoi
   read only = yes
   # force group : les fichiers crees appartiennent toujours a cmoi
   force group = cmoi
   create mode = 0664
   directory mode = 0775

# ---- amoi-anous : R+W pour cmoi, R pour cnous -------------
[amoi-anous]
   comment = Repertoire partage entre cmoi et cnous
   path = /partage/amoi-anous
   valid users = @cmoi @cnous
   write list = @cmoi
   read only = yes
   create mode = 0664
   directory mode = 0775
