;=======================================================================
;  extensions.conf  -  Plan de numerotation de l'atelier d'artiste
;=======================================================================

[globals]
DUREE_SONNERIE=20        ; secondes de sonnerie avant bascule sur la messagerie
FORCE_OUVERT=0           ; interrupteur de DEMO : 1 = atelier force ouvert (ignore l'heure)
                         ;   (se regle a chaud :  dialplan set global FORCE_OUVERT 1 )

;=======================================================================
;  SOUS-PROGRAMMES (reutilisables)
;=======================================================================

;-----------------------------------------------------------------------
; sub-poste : fait sonner un artiste, puis bascule sur sa messagerie
;   s'il ne repond pas / est occupe / est en mode ABSENT (DND).
;   Appel : Gosub(sub-poste,s,1(<numero_de_poste>))
;-----------------------------------------------------------------------
[sub-poste]
exten => s,1,NoOp(Appel vers le poste ${ARG1})
 same => n,Dial(PJSIP/${ARG1},${DUREE_SONNERIE})
 same => n,NoOp(Non repondu (statut=${DIALSTATUS}) -> messagerie vocale)
 same => n,Voicemail(${ARG1}@default,${IF($["${DIALSTATUS}"="BUSY"]?b:u)})
 same => n,Hangup()

;-----------------------------------------------------------------------
; sub-horaires : controle des horaires et des vacances.
;   Atelier ouvert 7j/7 de 08h00 a 18h00, du 01/09 au 11/06.
;   => Ferme pour conges du 12/06 au 31/08 (12-30 juin + juillet + aout).
;   Si ferme : annonce specifique puis raccrochage (l'appel ne revient pas).
;   Si ouvert : Return() vers le flux appelant.
;   (les horaires sont evalues en fuseau Europe/Paris)
;-----------------------------------------------------------------------
[sub-horaires]
exten => s,1,NoOp(Controle horaires - il est ${STRFTIME(,Europe/Paris,%A %d/%m %H:%M)})
 ; --- (mode demo) si FORCE_OUVERT=1, on force l'ouverture pour les tests ---
 same => n,GotoIf($["${FORCE_OUVERT}"="1"]?ouvert,1)
 ; --- Conges : juillet et aout en entier ---
 same => n,GotoIfTime(*,*,*,jul-aug,Europe/Paris?vacances,1)
 ; --- Conges : du 12 au 30 juin ---
 same => n,GotoIfTime(*,*,12-30,jun,Europe/Paris?vacances,1)
 ; --- Heures ouvrables : 08h00 a 18h00, tous les jours ---
 same => n,GotoIfTime(08:00-18:00,*,*,*,Europe/Paris?ouvert,1)
 ; --- sinon : on est en dehors des heures de travail ---
 same => n,Goto(hors-horaires,1)

; atelier ouvert -> on retourne au flux normal
exten => ouvert,1,Return()

; ferme (hors horaires) -> annonce puis raccrochage
exten => hors-horaires,1,NoOp(Atelier ferme : hors horaires)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/annonce-horaires)
 same => n,Hangup()

; ferme (conges) -> annonce puis raccrochage
exten => vacances,1,NoOp(Atelier ferme : conges)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/annonce-vacances)
 same => n,Hangup()

;=======================================================================
;  CONTEXTES PRINCIPAUX
;=======================================================================

;-----------------------------------------------------------------------
; [internal] : droits des 4 artistes (postes 200 a 203)
;-----------------------------------------------------------------------
[internal]
; Appels entre artistes (200 a 203)
exten => _20[0-3],1,NoOp(=== Appel interne ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Gosub(sub-poste,s,1(${EXTEN}))

; Consulter sa propre messagerie vocale : *97
exten => *97,1,NoOp(Consultation messagerie de ${CALLERID(num)})
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Appels SORTANTS vers le RTC (numeros publics francais a 10 chiffres)
; -> rediriges vers l'operateur (qui simule le reseau public)
exten => _0[1-9]XXXXXXXX,1,NoOp(=== Appel sortant ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Dial(PJSIP/operateur,30)
 same => n,Hangup()
; meme chose au format international E.164 (ex. Linphone envoie +33612345678)
exten => _+33XXXXXXXXX,1,NoOp(=== Appel sortant (E.164) ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Dial(PJSIP/operateur,30)
 same => n,Hangup()

;-----------------------------------------------------------------------
; [from-pstn] : tout appel ENTRANT depuis l'exterieur (l'operateur).
;   On controle d'abord les horaires/vacances, puis on route le numero.
;-----------------------------------------------------------------------
[from-pstn]
exten => _X.,1,NoOp(=== Appel entrant du RTC vers ${EXTEN} ===)
 same => n,Gosub(sub-horaires,s,1)        ; raccroche tout seul si ferme/vacances
 same => n,Goto(routage-public,${EXTEN},1)

;-----------------------------------------------------------------------
; [routage-public] : aiguillage des numeros publics (apres controle horaire)
;-----------------------------------------------------------------------
[routage-public]
; Numero principal de l'installation -> Serveur Vocal Interactif
exten => 0466666666,1,Goto(ivr,s,1)

; SDA : numeros directs achetes pour certains artistes
exten => 0477777777,1,NoOp(SDA directe -> Leon 200)
 same => n,Gosub(sub-poste,s,1(200))
exten => 0488888888,1,NoOp(SDA directe -> Mickael 202)
 same => n,Gosub(sub-poste,s,1(202))

; tout autre numero -> non attribue
exten => _X.,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/numero-inconnu)
 same => n,Hangup()

;-----------------------------------------------------------------------
; [ivr] : Serveur Vocal Interactif du 0466666666
;   0 -> Leon (200)   1 -> Paul (201)
;   2 -> Mickael (202)   3 -> Salvatore (203)
;-----------------------------------------------------------------------
[ivr]
exten => s,1,NoOp(=== Serveur Vocal Interactif de l'atelier ===)
 same => n,Answer()
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(TIMEOUT(response)=10)
 same => n(menu),Background(custom/ivr-menu)   ; "Bienvenue... tapez 0 pour Leon..."
 same => n,WaitExten(8)

exten => 0,1,Gosub(sub-poste,s,1(200))
exten => 1,1,Gosub(sub-poste,s,1(201))
exten => 2,1,Gosub(sub-poste,s,1(202))
exten => 3,1,Gosub(sub-poste,s,1(203))

; saisie invalide -> on rejoue le menu
exten => i,1,Playback(custom/ivr-invalide)
 same => n,Goto(s,menu)
; aucune saisie (timeout) -> on rejoue le menu
exten => t,1,Playback(custom/ivr-invalide)
 same => n,Goto(s,menu)
