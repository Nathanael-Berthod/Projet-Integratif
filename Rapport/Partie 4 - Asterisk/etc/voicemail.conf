;=======================================================================
;  voicemail.conf  -  Repondeur enregistreur des artistes
;  (utilise quand un artiste ne repond pas ou est en mode ABSENT)
;=======================================================================

[general]
format=wav49|gsm           ; formats d'enregistrement des messages
attach=no                  ; on n'envoie pas par e-mail (pas de serveur mail ici)
maxmsg=50                  ; nb max de messages par boite
maxsecs=120                ; duree max d'un message (secondes)
maxsilence=5               ; coupe apres 5 s de silence
skipms=3000
maxlogins=3
moveheard=yes

;-----------------------------------------------------------------------
; Contexte "default" : une boite par artiste.
;   Format :  <boite> => <code_PIN>,<nom affiche>
;   Code PIN = 1234 pour tous (simple pour le TP).
;-----------------------------------------------------------------------
[default]
200 => 1234,Leon Ardavinci
201 => 1234,Paul Picasso
202 => 1234,Mickael Angelo
203 => 1234,Salvatore Dalida
