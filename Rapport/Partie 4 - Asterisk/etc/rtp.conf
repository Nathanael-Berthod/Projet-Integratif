;=======================================================================
;  rtp.conf  -  Plage de ports UDP pour la voix (flux RTP)
;  On limite la plage pour n'ouvrir qu'un petit intervalle dans le
;  pare-feu GCP (au lieu de 10000-20000 par defaut).
;=======================================================================

[general]
rtpstart=10000
rtpend=10100
icesupport=no
