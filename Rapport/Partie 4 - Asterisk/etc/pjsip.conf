;=======================================================================
;  pjsip.conf  -  Atelier d'artiste (SAE 2.04 - partie 4)
;  Telephonie sur IP avec Asterisk (pile PJSIP) - SANS interface graphique
;=======================================================================

;-----------------------------------------------------------------------
; 1) TRANSPORT : on ecoute le SIP en UDP sur le port 5060.
;    La VM est sur Google Cloud : IP privee 10.132.0.2 DERRIERE l'IP
;    publique 34.62.55.225 (NAT 1:1). Il FAUT annoncer l'IP publique aux
;    softphones, sinon la voix (flux RTP) ne revient jamais.
;-----------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.132.0.0/20                 ; reseau prive interne GCP
external_media_address=34.62.55.225     ; IP publique annoncee pour l'audio
external_signaling_address=34.62.55.225 ; IP publique annoncee pour le SIP

;-----------------------------------------------------------------------
; 2) MODELES (templates) communs a tous les postes, pour ne pas se repeter
;-----------------------------------------------------------------------
[poste-endpoint](!)
type=endpoint
context=internal           ; ce que le poste a le droit de faire (cf extensions.conf)
disallow=all
allow=ulaw,alaw            ; codecs audio simples et universels
direct_media=no            ; l'audio transite PAR Asterisk (obligatoire en NAT)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes        ; gere les softphones derriere une box / NAT

[poste-auth](!)
type=auth
auth_type=userpass

[poste-aor](!)
type=aor
max_contacts=1             ; un seul appareil par compte
remove_existing=yes

;-----------------------------------------------------------------------
; 3) LES 4 ARTISTES (extensions a 3 chiffres : 200 a 203)
;    Pour chaque artiste : un endpoint + une auth + un aor, meme nom.
;-----------------------------------------------------------------------

; --- 200 : Leon Ardavinci ---
[200](poste-endpoint)
auth=200
aors=200
callerid=Leon Ardavinci <200>
mailboxes=200@default
[200](poste-auth)
username=200
password=Atelier200
[200](poste-aor)

; --- 201 : Paul Picasso ---
[201](poste-endpoint)
auth=201
aors=201
callerid=Paul Picasso <201>
mailboxes=201@default
[201](poste-auth)
username=201
password=Atelier201
[201](poste-aor)

; --- 202 : Mickael Angelo ---
[202](poste-endpoint)
auth=202
aors=202
callerid=Mickael Angelo <202>
mailboxes=202@default
[202](poste-auth)
username=202
password=Atelier202
[202](poste-aor)

; --- 203 : Salvatore Dalida ---
[203](poste-endpoint)
auth=203
aors=203
callerid=Salvatore Dalida <203>
mailboxes=203@default
[203](poste-auth)
username=203
password=Atelier203
[203](poste-aor)

;-----------------------------------------------------------------------
; 4) L'OPERATEUR = simulation du reseau public (RTC).
;    Ce compte joue "l'exterieur" : il compose les numeros publics
;    (0466666666, SDA 0477777777, 0488888888) et recoit les appels
;    sortants passes par les artistes. Son contexte est "from-pstn"
;    pour que ses appels soient traites comme des appels ENTRANTS.
;-----------------------------------------------------------------------
[operateur](poste-endpoint)
context=from-pstn
auth=operateur
aors=operateur
callerid=RTC <0600000000>
[operateur](poste-auth)
username=operateur
password=AtelierRTC
[operateur](poste-aor)
